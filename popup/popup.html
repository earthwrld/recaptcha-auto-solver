<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto-Solve reCAPTCHA</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>🤖 reCAPTCHA Solver</h2>
    <p>Masukkan API Key dari <a href="https://wit.ai" target="_blank">Wit.ai</a> (Server Access Token) untuk mulai menggunakan.</p>
    
    <div class="input-group">
      <label for="apiKey">Wit.ai API Key:</label>
      <input type="password" id="apiKey" placeholder="TARO_API_KEY_DISINI_XXX">
    </div>
    
    <button id="saveBtn">Simpan</button>
    <div id="status" class="hidden">Tersimpan!</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
